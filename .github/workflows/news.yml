name: Cricket news

# Har 2 ghante — GitHub ke free-minutes limit (private repo ~2000 min/month)
# ke andar rahta hai. Public repo par Actions ke minutes unlimited hote hain.
on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write  # seen.json commit karne ke liye

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Fetch news and send drafts to Telegram
        run: python fetch_news.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          HASHTAGS: "#TeamIndia #IndianCricket"

      - name: Save seen-news state
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add seen.json || true
          git diff --cached --quiet || git commit -m "chore: update seen news"
          git push
